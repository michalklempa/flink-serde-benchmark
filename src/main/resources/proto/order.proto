syntax = "proto3";

package com.michalklempa.flink.serde.benchmark.proto;

option java_package = "com.michalklempa.flink.serde.benchmark.proto";
option java_multiple_files = true;

enum OrderStatus {
  NEW = 0;
  PAID = 1;
  SHIPPED = 2;
  DELIVERED = 3;
  CANCELLED = 4;
}

message Address {
  string street = 1;
  string city = 2;
  string country = 3;
  string postal_code = 4;
}

message Customer {
  int64 customer_id = 1;
  string name = 2;
  string email = 3;
  bool vip = 4;
  Address address = 5;
}

message LineItem {
  string sku = 1;
  string name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double discount = 5;
}

message Order {
  string order_id = 1;
  int64 created_at_millis = 2;
  int64 updated_at_millis = 3;
  OrderStatus status = 4;
  Customer customer = 5;
  repeated LineItem items = 6;
  repeated string tags = 7;
  map<string, string> attributes = 8;
  double total_amount = 9;
  bytes payload = 10;
}
